org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for another_telephony plugin which still applies KGP (kotlin-android) manually.
# Remove these two lines once another_telephony releases a version with Built-in Kotlin support.
# Tracking: https://github.com/thanhdang198/Telephony/issues
android.newDsl=false
android.builtInKotlin=false
kotlin.jvm.target.validation.mode = IGNORE
kotlin.incremental=false


